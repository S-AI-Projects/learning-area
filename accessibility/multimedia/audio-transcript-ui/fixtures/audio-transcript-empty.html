<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Audio transcript example - Empty Result Fixture</title>
    <link href="../../custom-controls.css" rel="stylesheet">
    <style>
      .transcript-container {
        width: 480px;
        margin: 10px auto;
        border: 1px solid #ccc;
        min-height: 38px;
      }

      .transcript {
        height: 0;
        width: 100%;
        overflow: auto;
        padding: 0 10px;
      }

      .transcript-container button {
        width: 100%;
        height: 36px;
      }

      .empty-transcript {
        color: #555;
        font-style: italic;
        padding: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>Audio transcript example</h1>

    <section class="player">
      <audio controls>
        <source src="../../viper.mp3" type="audio/mp3">
        <source src="../../viper.ogg" type="audio/ogg">
        <p>Your browser doesn't support HTML5 audio. Here is a <a href="../../viper.mp3">link to the audio</a> instead.</p>
      </audio>

      <div class="controls">
        <button class="playpause">Play</button>
        <button class="stop">Stop</button>
        <button class="rwd">Rwd</button>
        <button class="fwd">Fwd</button>
        <div class="time">00:00</div>
      </div>
      <div class="audio-fallback" role="alert" style="display: none; padding: 8px 10px; background: #fff3cd; color: #856404; border-top: 1px solid #ffeeba; font-size: 14px; clear: both;">
        <p style="margin: 0;">Audio failed to load. You can try the <a href="../../viper.mp3">direct audio link</a> instead.</p>
      </div>
    </section>

    <div class="transcript-container">
      <div class="transcript-control">
        <button>Show transcript</button>
      </div>
      <section class="transcript">
        <p class="empty-transcript">No transcript is available for this recording.</p>
      </section>
    </div>

    <script src="../main.js"></script>
  </body>
</html>
