<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Arrow function example</title>
    <link href="style.css" rel="stylesheet">
  </head>

  <body>
    <main>
      <h1>Arrow function example</h1>
      <p>This diagram shows how the array is turned into the numbered names below.</p>
      <figure class="flow-diagram">
        <img
          src="arrow-function-flow.svg"
          alt="Diagram showing a names array passed through an arrow function to produce a numbered list."
        >
        <figcaption id="diagram-fallback" role="status" hidden>
          Diagram unavailable. The numbered names below are still generated by the arrow function.
        </figcaption>
      </figure>
      <section class="results" aria-label="Names generated by the arrow function"></section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
