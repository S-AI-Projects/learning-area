<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>My test page</title>

    <style>
      .skip-link {
        position: absolute;
        top: -100px;
        left: 10px;
        padding: 10px;
        background: white;
        color: black;
        z-index: 1000;
      }

      .skip-link:focus {
        top: 10px;
        outline: 3px solid blue;
        outline-offset: 3px;
      }
    </style>
  </head>

  <body>
    <a class="skip-link" href="#main-content">
      Skip to main content
    </a>

    <main id="main-content" tabindex="-1">
      <p>This is my page</p>
    </main>
  </body>
</html>
