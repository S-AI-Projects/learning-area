<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Items sold summary</title>
    <link href="minimal-table.css" rel="stylesheet" type="text/css">
  </head>

<body>
    <h1>
      <img src="sales-report-icon.png" alt="Sales Report Icon" class="report-icon" onerror="this.style.display='none'; document.getElementById('icon-fallback').style.display='inline-block';">
      <span id="icon-fallback" class="icon-fallback" style="display:none;" aria-label="Sales Report">📊</span>
      Items sold summary
    </h1>

    <div class="table-controls">
      <label for="table-filter">Filter records:</label>
      <input type="search" id="table-filter" placeholder="Search country or city...">
    </div>

    <table>
      <caption>Items Sold August 2016</caption>
      <thead>
        <tr>
          <td colspan="2" rowspan="2"></td>
          <th colspan="3">Clothes</th>
          <th colspan="2">Accessories</th>
        </tr>
        <tr>
          <th>Trousers</th>
          <th>Skirts</th>
          <th>Dresses</th>
          <th>Bracelets</th>
          <th>Rings</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th rowspan="3">Belgium</th>
          <th>Antwerp</th>
          <td>56</td>
          <td>22</td>
          <td>43</td>
          <td>72</td>
          <td>23</td>
        </tr>
        <tr>
          <th>Ghent</th>
          <td>46</td>
          <td>18</td>
          <td>50</td>
          <td>61</td>
          <td>15</td>
        </tr>
        <tr>
          <th>Brussels</th>
          <td>51</td>
          <td>27</td>
          <td>38</td>
          <td>69</td>
          <td>28</td>
        </tr>
        <tr>
          <th rowspan="2">The Netherlands</th>
          <th>Amsterdam</th>
          <td>89</td>
          <td>34</td>
          <td>69</td>
          <td>85</td>
          <td>38</td>
        </tr>
        <tr>
          <th>Utrecht</th>
          <td>80</td>
          <td>12</td>
          <td>43</td>
          <td>36</td>
          <td>19</td>
        </tr>
        <tr id="empty-state-row" class="empty-state" style="display: none;">
          <td colspan="7">No matching sales records found.</td>
        </tr>
      </tbody>
    </table>

    <script>
      const filterInput = document.getElementById('table-filter');
      const rows = document.querySelectorAll('tbody tr:not(#empty-state-row)');
      const emptyRow = document.getElementById('empty-state-row');

      if (filterInput) {
        filterInput.addEventListener('input', function() {
          const q = this.value.trim().toLowerCase();
          let visibleCount = 0;
          rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            if (text.includes(q)) {
              row.style.display = '';
              visibleCount++;
            } else {
              row.style.display = 'none';
            }
          });
          if (visibleCount === 0) {
            emptyRow.style.display = '';
          } else {
            emptyRow.style.display = 'none';
          }
        });
      }
    </script>
</body>

</html>
